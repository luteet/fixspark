<article class="case-card">
	<div class="case-card__media" aria-label="Case @@number: @@label.">
		<picture>
			<source srcset="img/index/repairs/repairs-image-@@image.avif" type="image/avif">
			<source srcset="img/index/repairs/repairs-image-@@image.webp" type="image/webp">
			<img src="img/index/repairs/repairs-image-@@image.png" alt="" width="366" height="274" loading="lazy">
		</picture>
		<span class="case-card__price" aria-hidden="true">$@@price</span>
	</div>
	<div class="case-card__body">
		<p class="case-card__meta">@@meta</p>
		<h3 class="case-card__title">@@title</h3>
		<p class="case-card__text">@@text</p>
		<span class="visually-hidden">Total: $@@price</span>
	</div>
</article>
