<li class="guide-card">
	<a class="guide-card__link" href="@@href">
		<span class="guide-card__media">
			<picture>
				<source srcset="@@image.avif" type="image/avif">
				<source srcset="@@image.webp" type="image/webp">
				<img src="@@image.jpg" alt="@@alt" width="1024" height="1568" loading="lazy">
			</picture>
		</span>
		<span class="guide-card__body">
			<span class="guide-card__topic">@@topic</span>
			<span class="guide-card__title">@@title</span>
			<span class="guide-card__text">@@text</span>
			<span class="guide-card__meta">
				<span>@@date</span>
				<span aria-hidden="true">·</span>
				<span>@@read</span>
			</span>
			<span class="guide-card__more">
				Read the guide
				<svg width="14" height="14" aria-hidden="true" focusable="false">
					<use href="img/sprites.svg#arrow-right" />
				</svg>
			</span>
		</span>
	</a>
</li>
