<div class="faq__item">
	<h3 class="faq__heading">
		<button class="faq__question" id="faq-question-@@id" type="button" aria-expanded="false" aria-controls="faq-answer-@@id">
			@@question
			<span class="faq__icon" aria-hidden="true"></span>
		</button>
	</h3>
	<div class="faq__answer" id="faq-answer-@@id" role="region" aria-labelledby="faq-question-@@id">
		<div class="faq__answer-inner">@@answer</div>
	</div>
</div>
