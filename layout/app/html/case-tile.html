<li class="case-tile" data-cases-category="@@category">
	<a class="case-tile__link" href="https://via.placeholder.com/1600x1200?text=@@label" target="_blank" rel="noopener">
		<img class="case-tile__image" src="https://via.placeholder.com/800x600?text=@@label" width="800" height="600" alt="@@alt" loading="lazy">
		<span class="case-tile__body">
			<span class="case-tile__title">@@title</span>
			<span class="case-tile__text">@@text</span>
			<span class="case-tile__hint">
				Open photo
				<svg width="14" height="14" aria-hidden="true" focusable="false">
					<use href="img/sprites.svg#arrow-right" />
				</svg>
			</span>
		</span>
	</a>
</li>
