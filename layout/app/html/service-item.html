<li class="services__item">
	<a class="services__link@@class" href="#book">
		<span class="services__num" aria-hidden="true">@@number</span>
		<span class="services__name">@@name</span>
		<span class="services__price">
			<span class="services__price-row">Diagnostic <b>$@@price.diagnostic</b></span>
			<span class="services__price-row">Repairs from <b>$@@price.repairs</b></span>
		</span>
		<span class="services__arrow" aria-hidden="true">
			<svg width="20" height="20" aria-hidden="true" focusable="false">
				<use href="img/sprites.svg#chevron-right" />
			</svg>
		</span>
		<span class="services__cta">View service</span>
	</a>
</li>
